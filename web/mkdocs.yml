site_name: Sikh Literature
site_description: English translations of Sikh historical texts

theme:
  name: material
  font:
    text: Lora
  features:
    - navigation.top
    - navigation.indexes
    - navigation.prune
    - navigation.sections
    - search.suggest
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Night reading
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Day reading

markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.escapeall:
      hardbreak: true      # keeps the Gurbani three-line groups on separate lines

plugins:
  - search

hooks:
  - hooks/build_pages.py

extra_css:
  - assets/reading.css

extra_javascript:
  - assets/footnotes.js
