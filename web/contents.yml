# The map of every text on the site.
#
# This one file controls what appears. A reading listed here always has a page:
# if a matching .md file exists under docs/ it is used, otherwise the page is
# generated as "not yet posted". Nothing else needs editing.
#
#   To add a division (a Ras, a volume, a chapter): add a line under `divisions`.
#   To extend one: raise its `to`.
#   To add a whole text: copy the shape of one below.
#   To post a reading: create the .md file at the path its page tells you.

